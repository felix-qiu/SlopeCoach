[project]
name = "slopecoach-ml"
version = "0.1.0"
description = "SlopeCoach AI research, reference, and benchmark implementation"
requires-python = ">=3.11,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<0.13",
]

[project.scripts]
slopecoach-ml = "slopecoach_ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slopecoach_ml"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
